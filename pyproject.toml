[project]
name = "mediscribe-ai"
version = "0.1.0"
description = "FastAPI backend for MediScribe AI — AI-powered medical SOAP notes from doctor-patient conversations."
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "MediScribe Team"},
]
dependencies = [
    "fastapi[standard]>=0.141.0,<0.142.0",
    "uvicorn[standard]>=0.52.0,<0.53.0",
    "pydantic>=2.13.0,<2.14.0",
    "pydantic-settings>=2.8.0,<2.9.0",
    "email-validator>=2.2.0,<2.3.0",
    "sqlalchemy>=2.0.51,<2.1.0",
    "alembic>=1.18.0,<1.19.0",
    "psycopg[binary]>=3.3.0,<3.4.0",
    "httpx>=0.28.0,<0.29.0",
    "python-jose[cryptography]>=3.4.0,<3.5.0",
    "argon2-cffi>=23.1.0,<24.0.0",
    "python-multipart>=0.0.20,<0.1.0",
    "reportlab>=4.4.0,<4.5.0",
    "supabase>=2.16.0,<2.17.0",
    "mistralai>=1.5.0,<2.0.0",
    "google-genai>=2.0.0,<3.0.0",
    "gunicorn>=23.0.0,<24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0,<8.5.0",
    "pytest-asyncio>=0.25.0,<0.26.0",
    "httpx>=0.28.0,<0.29.0",
    "ruff>=0.11.0,<0.12.0",
    "mypy>=1.16.0,<1.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=8.4.0,<8.5.0",
    "pytest-asyncio>=0.25.0,<0.26.0",
    "ruff>=0.11.0,<0.12.0",
]
